<VirtualHost *:80>
	ServerAdmin webmaster@localhost

	DocumentRoot /var/www/bitrix
	# Как в bitrix-env: файлы из /upload/ с этими расширениями скачиваются, а не исполняются
	ProxyPassMatch (?i)^/upload/ !
	<LocationMatch "(?i)^/upload/.*\.(html|htm|php|php3|php4|php5|php6|phtml|pl|asp|aspx|cgi|dll|exe|shtm|shtml|fcg|fcgi|fpl|asmx|pht)$">
	    Header set Content-Disposition "attachment"
	</LocationMatch>
	ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://php:9000/var/www/bitrix/$1
	ProxyTimeout 300
	ProxyPassMatch ^/(fpm-ping|fpm-status) fcgi://php:9000 

	<IfModule dir_module>
	    DirectoryIndex index.html
	</IfModule>

	<Files ".ht*">
	    Require all denied
	</Files>

	<Directory />
		Options FollowSymLinks
		AllowOverride None
	</Directory>

	<Directory "/var/www/bitrix/">
	    AllowOverride All
	    Options None
	    Require all granted
	</Directory>

	ErrorLog /var/log/apache-error.log

	# Possible values include: debug, info, notice, warn, error, crit,
	# alert, emerg.
	LogLevel warn

	CustomLog /var/log/apache-access.log combined

</VirtualHost>